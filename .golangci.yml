version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    govet:
      enable:
        - nilness
        - shadow
      # Go 1.26 的 inline analyzer 只给出“可内联类型别名/常量/调用”的
      # 优化建议，不代表正确性问题；它会对 context alias 等稳定 API 产生
      # 大量版本相关噪声。正确性门保留 nilness 与 shadow。
      disable:
        - inline
    errcheck:
      check-type-assertions: false
      check-blank: false
    misspell:
      locale: US
  exclusions:
    generated: lax
    paths:
      - common
      - util/generated
    rules:
      - path: \.pb\.go$
        linters:
          - all
