name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read
  pull-requests: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  # CI is a release-isolation gate. Local projects may intentionally use their own go.work.
  GOWORK: off

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out tgf
        uses: actions/checkout@v6
        with:
          path: tgf

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: tgf/go.sum

      - name: Download dependencies
        working-directory: tgf
        run: go mod download

      - name: Verify public dependency graph
        working-directory: tgf
        shell: bash
        run: |
          for module in github.com/thkhxm/rpcx/v2 github.com/thkhxm/rpcx-consul/v2; do
            replacement="$(go list -m -f '{{with .Replace}}{{.Path}}{{end}}' "$module")"
            version="$(go list -m -f '{{.Version}}' "$module")"
            test -z "$replacement"
            test -n "$version"
            go mod download "$module@$version"
          done

      - name: Build
        working-directory: tgf
        run: go build ./...

      - name: Vet
        working-directory: tgf
        run: go vet ./...

      - name: Test with race detector
        working-directory: tgf
        run: go test -race -count=1 -timeout=10m ./...

  integration:
    name: Integration tests (full + race gate)
    runs-on: ubuntu-latest
    env:
      TGFMODULE: test
      RedisAddr: 127.0.0.1:6379
      RedisPassword: ""
      MySqlUser: root
      MySqlPwd: root
      MySqlAddr: 127.0.0.1
      MySqlPort: "3306"
      MySqlDB: tgf_game_test
      ConsulAddress: 127.0.0.1:8500
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tgf_game_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      consul:
        image: hashicorp/consul:1.18
        ports:
          - 8500:8500
        options: >-
          --health-cmd "consul members"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out tgf
        uses: actions/checkout@v6
        with:
          path: tgf

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: tgf/go.sum

      - name: Download dependencies
        working-directory: tgf
        run: go mod download

      # The full non-race track also exercises links that are isolated from the race
      # track because of explicitly documented server-global lifetime constraints.
      - name: Run full integration tests (without race detector)
        working-directory: tgf
        run: go test -tags=integration -count=1 -timeout=15m ./...

      # Keep race coverage as an additional gate; it does not replace the full track above.
      - name: Run integration race gate
        working-directory: tgf
        run: go test -race -tags=integration -count=1 -timeout=15m ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out tgf
        uses: actions/checkout@v6
        with:
          path: tgf

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: tgf/go.sum

      - name: Download dependencies
        working-directory: tgf
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: tgf
          args: --timeout=5m
