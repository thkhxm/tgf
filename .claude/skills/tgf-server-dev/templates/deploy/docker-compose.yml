# {{PROJECT_NAME}} 本地/测试编排：Redis + MySQL + Consul + 业务进程
#
# 只起依赖（本机 go run 业务进程）：
#   docker compose -f deploy/docker-compose.yml up -d consul redis mysql
# 全量起（业务也容器化）：
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 按场景裁剪：单进程游戏服/纯 REST 不需要 consul；CacheModuleClose 不需要 redis/mysql。

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_pwd}
      MYSQL_DATABASE: "{{PROJECT_NAME}}"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot", "-p${MYSQL_ROOT_PASSWORD:-dev_root_pwd}"]
      interval: 5s
      timeout: 3s
      retries: 20

  consul:
    image: hashicorp/consul:1.19
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"   # HTTP API + UI: http://127.0.0.1:8500

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # distributed 模板按进程各写一个 service，分别传 MAIN_PKG=./cmd/gateway、./cmd/game
      # args:
      #   MAIN_PKG: ./cmd/gateway
    environment:
      TGFMODULE: dev
      # 容器网络内用服务名互联（覆盖 .env.dev 里的本机地址）
      RedisAddr: redis:6379
      MySqlAddr: mysql
      ConsulAddress: consul:8500
      # 敏感项经环境注入，不烧进镜像
      LoginTokenSecret: ${LOGIN_TOKEN_SECRET:?请在 .env 或 shell 中提供 LOGIN_TOKEN_SECRET}
      # ADMIN_TOKEN: ${ADMIN_TOKEN}
    ports:
      - "8082:8082"   # 客户端 TCP 网关（游戏形态）
      - "8090:8090"   # HTTP（web 形态，按模板端口调整）
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      consul:
        condition: service_started
    # 框架捕获 SIGTERM 优雅停机；给足 drain 时间
    stop_grace_period: 30s

volumes:
  mysql-data:
